# Default configuration of coverage_planner_core (same layout as iroc_fleet_manager's coverage_planner_config.yaml).
#
# All drones share one cost model: the solver balances the paths assuming identical drones.

# --- solver tuning ---
number_of_rotations: 3                  # initial decomposition rotations to try (runtime grows linearly)
decomposition_method: 1                 # 0 trapezoidal, 1 boustrophedon, 2 boustrophedon with convex polygons
min_sub_polygons_per_uav: 1
rotations_per_cell: 4
no_improvement_cycles_before_stop: 400
sweeping_step: 6.0                      # default lane spacing [m] (a request may override it)
time_budget_s: 10.0                     # wall-clock cap on the tabu search; keeps on-board planning bounded

# --- cost model ---
drones:
  - optimization_type: "time"           # "time" [s] or "energy" [J]
    max_speed: 4.0                      # [m/s]; keep at or below the MRS constraint profile in use
    max_acceleration: 2.0               # [m/s^2]
    allowed_path_deviation: 2.0         # [m] corner cutting allowed in turns
    max_single_path_cost: 1800.0        # [s] longest acceptable path per drone

